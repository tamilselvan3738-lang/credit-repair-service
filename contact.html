      max-width: 100% !important;

    section {
      width: 100% !important;
      max-width: 100vw !important;
    }

       RESPONSIVE BREAKPOINTS (320px, 480px, 768px, 1024px)
       ========================================================================== */

    /* Breakpoint 1: Ultra-compact handhelds (320px boundary, e.g. <= 359px) */
    @media (max-width: 359px) {
      section {

        line-height: 1.25 !important;

                  <span className="font-mono text-cyan-400 font-bold block text-[10px] uppercase">TOLL-FREE 24/7</span>

    // --- MAIN APPLICATION: CLEAN SHOWCASE STAGE ---
    function App() {
      const [theme, setTheme] = useState(() => {
        try {
          const p = new URLSearchParams(window.location.search).get('theme');
          if (p === 'light' || p === 'dark') return p;
        } catch(e) {}
        return localStorage.getItem('crs_theme') || 'dark';
      });
      const [dir, setDir] = useState(() => {
        try {
          const p = new URLSearchParams(window.location.search).get('dir');
          if (p === 'rtl' || p === 'ltr') return p;
        } catch(e) {}
        return localStorage.getItem('crs_dir') || 'ltr';
      });
      const [activeSection, setActiveSection] = useState('home');
      const [homeVariant, setHomeVariant] = useState('home1');
      const [loginModalOpen, setLoginModalOpen] = useState(false);
      const [dashboardModalType, setDashboardModalType] = useState(null);

      // Sync Theme with DOM
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('crs_theme', theme);
      }, [theme]);

      // Sync RTL / LTR with DOM
      useEffect(() => {
        document.documentElement.setAttribute('dir', dir);
        localStorage.setItem('crs_dir', dir);
      }, [dir]);

      const toggleTheme = () => setTheme((t) => (t === 'dark' ? 'light' : 'dark'));
      const toggleDir = () => setDir((d) => (d === 'ltr' ? 'rtl' : 'ltr'));

      const isDark = theme === 'dark';
      const isRtl = dir === 'rtl';

      return (
        <div className={`min-h-screen flex flex-col justify-between ${isDark ? 'bg-[#030712] text-slate-100' : 'bg-slate-50 text-slate-900'} font-sans relative`}>
          
          {/* EXTRAORDINARY 3D FLOATING NAVBAR */}
          <Navbar
            theme={theme}
            toggleTheme={toggleTheme}
            dir={dir}
            toggleDir={toggleDir}
            activeSection={activeSection}
            setActiveSection={setActiveSection}
            onOpenLogin={() => { window.location.href = 'login.html'; }}
            onOpenDashboard={(type) => setDashboardModalType(type)}
            homeVariant={homeVariant}
            setHomeVariant={setHomeVariant}
          />

          {/* Spacer so the floating navbar floats cleanly above the footer */}
                    {/* 7 UNIQUE CONTACT COMMAND CENTER SECTIONS */}
          <main id="main-content" className="flex-1 w-full relative z-10">
            {/* SECTION 01: CONTACT HERO OVERVIEW */}

              isDark={isDark}
              isRtl={isRtl}
              onOpenLogin={() => { window.location.href = 'login.html'; }}
              onOpenDashboard={(type) => setDashboardModalType(type)}
              setActiveSection={setActiveSection}
            />

            {/* SECTION 02: LOCATION MAP & PHYSICAL HEADQUARTERS & BUSINESS HOURS */}
            <ContactLocationMapSection
              isDark={isDark}
              isRtl={isRtl}
            />

            {/* SECTION 03: MULTI-CHANNEL CUSTOMER SUPPORT & ESCALATION DESKS */}
            <ContactCustomerSupportSection
              isDark={isDark}
              isRtl={isRtl}
              onOpenLogin={() => { window.location.href = 'login.html'; }}
            />

            {/* SECTION 04: FREE CONSULTATION REQUEST WIZARD */}
            <ContactFreeConsultationSection
              isDark={isDark}
              isRtl={isRtl}
              onOpenLogin={() => { window.location.href = 'login.html'; }}
            />

            {/* SECTION 05: CREDIT REPAIR ENQUIRY FORM */}
            <ContactCreditRepairEnquirySection
              isDark={isDark}
              isRtl={isRtl}
            />

            {/* SECTION 06: GENERAL ENQUIRY FORM & DIRECT MESSAGING */}
            <ContactGeneralEnquirySection
              isDark={isDark}
              isRtl={isRtl}
            />

            {/* SECTION 07: DIRECT CONCIERGE HOTLINE & 24/7 EMERGENCY DISPATCH CTA */}
            <ContactEmergencyHotlineCtaSection
              isDark={isDark}
              isRtl={isRtl}
              onOpenLogin={() => { window.location.href = 'login.html'; }}
              onOpenDashboard={(type) => setDashboardModalType(type)}
            />
          </main>

          {/* COMPREHENSIVE FINTECH FOOTER (BASED ON NAVBAR CONTENT) */}
          <Footer
            isDark={isDark}
            isRtl={isRtl}
            onOpenLogin={() => { window.location.href = 'login.html'; }}
            onOpenDashboard={(type) => setDashboardModalType(type)}
            setHomeVariant={setHomeVariant}
            setActiveSection={setActiveSection}
          />

          {/* INTERACTIVE MODALS */}
          <LoginModal
            isOpen={loginModalOpen}
            onClose={() => setLoginModalOpen(false)}
            isDark={isDark}
          />

          <DashboardPreviewModal
            type={dashboardModalType}
            isOpen={!!dashboardModalType}
            onClose={() => setDashboardModalType(null)}
            isDark={isDark}
          />

        </div>
      );
    }

    // Render React Application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
