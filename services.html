              onOpenDashboard={(type) => setDashboardModalType(type)}
            />

            {/* SECTION 02: CREDIT REPORT ANALYSIS ENGINE */}
            <CreditReportAnalysisSection
              isDark={isDark}
            />

            {/* SECTION 03: CREDIT DISPUTE SERVICES HUB */}
            <CreditDisputeServicesSection
              isDark={isDark}
              onOpenLogin={() => { window.location.href = 'login.html'; }}
            />

            {/* SECTION 04: CREDIT SCORE IMPROVEMENT GUIDANCE MATRIX */}
            <CreditScoreGuidanceSection
              isDark={isDark}
            />

            {/* SECTION 05: CREDIT MONITORING SENTINEL RADAR */}
            <CreditMonitoringSection
              isDark={isDark}
            />

            {/* SECTION 06: IDENTITY & FRAUD DEFENSE SANCTUARY */}
            <IdentityFraudAssistanceSection
              isDark={isDark}
            />

            {/* SECTION 07: FINANCIAL EDUCATION & LIFELONG WEALTH ACADEMY */}
            <FinancialEducationSection
              isDark={isDark}
            />
          </main>

          {/* COMPREHENSIVE FINTECH FOOTER (BASED ON NAVBAR CONTENT) */}
          <Footer
            isDark={isDark}
            isRtl={isRtl}
            onOpenLogin={() => { window.location.href = 'login.html'; }}
            onOpenDashboard={(type) => setDashboardModalType(type)}
            setHomeVariant={setHomeVariant}
            setActiveSection={setActiveSection}
          />

          {/* INTERACTIVE MODALS */}
          <LoginModal
            isOpen={loginModalOpen}
            onClose={() => setLoginModalOpen(false)}
            isDark={isDark}
          />

          <DashboardPreviewModal
            type={dashboardModalType}
            isOpen={!!dashboardModalType}
            onClose={() => setDashboardModalType(null)}
            isDark={isDark}
          />

        </div>
      );
    }

    // Render React Application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
