<!DOCTYPE html>
<html>
<head>
<title>Moon Icons Test</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 40px; background: #f8fafc; }
  .row { display: flex; align-items: center; gap: 20px; }
  .box { width: 44px; height: 44px; border: 1px solid #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: white; }
  svg { width: 24px; height: 24px; stroke: #4f46e5; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <h2>Comparison of Moon Icons</h2>
  
  <div class="row">
    <div class="box">
      <!-- Current codebase path with rotate 180 (as in light mode) -->
      <div style="transform: rotate(180deg);">
        <svg viewBox="0 0 24 24">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </div>
    </div>
    <span>1. Current codebase path with <strong>rotate(180deg)</strong> (This is what is currently shown in light mode!)</span>
  </div>

  <div class="row">
    <div class="box">
      <!-- Current codebase path rotate 0 -->
      <svg viewBox="0 0 24 24">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </div>
    <span>2. Current codebase path at <strong>rotate(0deg)</strong></span>
  </div>

  <div class="row">
    <div class="box">
      <!-- Standard Lucide / Feather Moon -->
      <svg viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </div>
    <span>3. Standard Feather / Lucide Crescent Moon: <code>M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z</code></span>
  </div>

  <div class="row">
    <div class="box">
      <!-- Heroicons 24/outline Moon -->
      <svg viewBox="0 0 24 24">
        <path d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
      </svg>
    </div>
    <span>4. Modern Heroicons Crescent Moon</span>
  </div>
</body>
</html>
