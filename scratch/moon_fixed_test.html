<!DOCTYPE html>
<html>
<head>
<title>Fixed Moon Icon Test</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
<style>
  body { background: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body class="p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { motion, AnimatePresence } = window.Motion || window.FramerMotion;

    const IconSun = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    );

    // FIXED ICON MOON: Standard Feather / Lucide crescent
    const IconMoon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    );

    function App() {
      const [isDark, setIsDark] = useState(false);

      return (
        <div className="space-y-6 max-w-md mx-auto p-6 bg-white rounded-2xl shadow-lg border border-slate-200">
          <h2 className="text-lg font-bold text-slate-800">Fixed Navbar Theme Toggle Button</h2>
          
          <div className="flex items-center gap-4">
            <button
              type="button"
              onClick={() => setIsDark(!isDark)}
              className="w-10 h-10 rounded-xl flex items-center justify-center transition-all bg-slate-100 hover:bg-slate-200 border border-slate-200 group shadow-sm"
              title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}
            >
              <motion.div
                key={isDark ? "dark" : "light"}
                initial={{ rotate: -30, opacity: 0, scale: 0.8 }}
                animate={{ rotate: 0, opacity: 1, scale: 1 }}
                transition={{ duration: 0.22, ease: "easeOut" }}
              >
                {isDark ? (
                  <IconSun className="w-4 h-4 text-amber-400 group-hover:rotate-45 transition-transform" />
                ) : (
                  <IconMoon className="w-4 h-4 text-indigo-600 group-hover:-rotate-12 transition-transform" />
                )}
              </motion.div>
            </button>
            <div className="text-sm font-medium text-slate-700">
              Current Mode: <span className="font-bold text-indigo-600">{isDark ? "Dark (Sun)" : "Light (Moon)"}</span>
              <p className="text-xs text-slate-500">Notice the crescent moon is perfectly upright, sharp, and aligned.</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
