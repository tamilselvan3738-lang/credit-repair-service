    // ==========================================================================

    function LoginPage() {
      // Synchronize with localStorage matching index.html
      const [theme, setTheme] = useState(() => {
        if (typeof window !== 'undefined') {
          return localStorage.getItem('crs_theme') || 'dark';
        }
        return 'dark';
      });

      const [dir, setDir] = useState(() => {
        if (typeof window !== 'undefined') {
          return localStorage.getItem('crs_dir') || 'ltr';
        }
        return 'ltr';
      });

      // Form state
      const [usernameOrEmail, setUsernameOrEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(true);

      // Status simulation
      const [authStatus, setAuthStatus] = useState('idle'); // idle | loading | success | error
      const [authMessage, setAuthMessage] = useState('');

      // Forgot Password Modal state
      const [forgotModalOpen, setForgotModalOpen] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotSent, setForgotSent] = useState(false);

      const [registerModalOpen, setRegisterModalOpen] = useState(false);

      const [regPass, setRegPass] = useState('');
      const [regSuccess, setRegSuccess] = useState(false);

      // Synchronize html class and localStorage
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.remove('dark');
          root.classList.add('light');
        }
        localStorage.setItem('crs_theme', theme);
      }, [theme]);

        const root = document.documentElement;
        root.setAttribute('dir', dir);
        localStorage.setItem('crs_dir', dir);
      }, [dir]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };

      const toggleDir = () => {
        setDir(prev => (prev === 'ltr' ? 'rtl' : 'ltr'));
      };

      const isDark = theme === 'dark';

        setUsernameOrEmail('sarah.miller@creditrepair.fintech');

        setAuthStatus('loading');
        setAuthMessage('Verifying 256-Bit Credentials...');

          setAuthStatus('success');
          setAuthMessage('Access Granted! Redirecting...');
          setTimeout(() => {

        }, 1100);
      };

        e.preventDefault();

        setForgotSent(true);
        setTimeout(() => {
          setForgotSent(false);
          setForgotModalOpen(false);
          setForgotEmail('');

        e.preventDefault();
        if (!regName || !regEmail || !regPass) return;
        setRegSuccess(true);
        setTimeout(() => {
          setRegSuccess(false);
          setRegisterModalOpen(false);
          setUsernameOrEmail(regEmail);
          setPassword(regPass);
          setAuthMessage('Account created! Click Log In to enter.');

                  </p>

                  {forgotSent ? (
                    <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold flex items-center gap-2">
                      <IconCheckCircle className="w-4 h-4 flex-shrink-0" />
                      <span>Security OTP dispatched to {forgotEmail}!</span>
                    </div>
                  ) : (
                    <form onSubmit={handleForgotSubmit} className="space-y-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-300">
                          Registered Email
                        </label>
                        <input
                          type="email"
                          required
                          value={forgotEmail}
                          onChange={(e) => setForgotEmail(e.target.value)}
                          placeholder="client@creditrepair.com"
                          className={`w-full px-3 py-2 rounded-xl text-xs border outline-none ${
                            isDark
                              ? 'bg-slate-900 border-slate-700 text-white focus:border-amber-400'
                              : 'bg-slate-50 border-slate-300 text-slate-900 focus:border-amber-500'
                          }`}
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-xl font-display font-bold text-xs uppercase tracking-wider text-slate-950 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 transition-all shadow-md"
                      >
                        Send 6-Digit OTP
                      </button>
                    </form>
                  )}
                </motion.div>
              </div>
            )}
          </AnimatePresence>

          {/* ================================================================ */}
          {/* CREATE ACCOUNT MODAL */}
          {/* ================================================================ */}
          <AnimatePresence>
            {registerModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <motion.div
                  initial={{ opacity: 0, scale: 0.95, y: 14 }}
                  animate={{ opacity: 1, scale: 1, y: 0 }}
                  exit={{ opacity: 0, scale: 0.95, y: 14 }}
                  className={`w-full max-w-sm rounded-3xl p-6 border shadow-3d-card relative ${
                    isDark ? 'bg-[#0b1222] border-slate-700/80 text-white' : 'bg-white border-slate-200 text-slate-900'
                  }`}
                >
                  <button
                    type="button"
                    onClick={() => setRegisterModalOpen(false)}
                    className="absolute top-4 right-4 w-7 h-7 rounded-full border border-slate-700 flex items-center justify-center text-slate-400 hover:text-white text-xs"
                  >
                    <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>

                  <h3 className="font-display font-bold text-lg mb-1">Create Client Account</h3>
                  <p className="text-[11px] text-slate-400 mb-4 leading-relaxed">
                    Set up your 256-bit encrypted credit audit workspace in seconds.
                  </p>

                  {regSuccess ? (
                    <div className="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold flex items-center gap-2">
                      <IconCheckCircle className="w-4 h-4 flex-shrink-0" />
                      <span>Account created successfully! Loading portal...</span>
                    </div>
                  ) : (
                    <form onSubmit={handleRegisterSubmit} className="space-y-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-300">
                          Full Name
                        </label>
                        <input
                          type="text"
                          required
                          value={regName}
                          onChange={(e) => setRegName(e.target.value)}
                          placeholder="Sarah Miller"
                          className={`w-full px-3 py-2 rounded-xl text-xs border outline-none ${
                            isDark
                              ? 'bg-slate-900 border-slate-700 text-white focus:border-emerald-500'
                              : 'bg-slate-50 border-slate-300 text-slate-900 focus:border-emerald-500'
                          }`}
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-300">
                          Email Address
                        </label>
                        <input
                          type="email"
                          required
                          value={regEmail}
                          onChange={(e) => setRegEmail(e.target.value)}
                          placeholder="client@creditrepair.com"
                          className={`w-full px-3 py-2 rounded-xl text-xs border outline-none ${
                            isDark
                              ? 'bg-slate-900 border-slate-700 text-white focus:border-emerald-500'
                              : 'bg-slate-50 border-slate-300 text-slate-900 focus:border-emerald-500'
                          }`}
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-300">
                          Password
                        </label>
                        <input
                          type="password"
                          required
                          value={regPass}
                          onChange={(e) => setRegPass(e.target.value)}
                          placeholder="Create strong password"
                          className={`w-full px-3 py-2 rounded-xl text-xs border outline-none ${
                            isDark
                              ? 'bg-slate-900 border-slate-700 text-white focus:border-emerald-500'
                              : 'bg-slate-50 border-slate-300 text-slate-900 focus:border-emerald-500'
                          }`}
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-xl font-display font-bold text-xs uppercase tracking-wider text-white bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 transition-all shadow-md"
                      >
                        Register Account
                      </button>
                    </form>
                  )}
                </motion.div>
              </div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    // Render React Root
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<LoginPage />);
  </script>
</body>
</html>
