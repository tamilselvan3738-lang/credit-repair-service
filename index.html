              isDark={isDark}
              isRtl={isRtl}
              onOpenLogin={() => { window.location.href = 'login.html'; }}
            />

            {/* SECTION 05: CREDIT MONITORING & SUCCESS (GROWTH OBSERVATORY) */}
            <CreditMonitoringSuccess
              isDark={isDark}
              isRtl={isRtl}
              onOpenLogin={() => { window.location.href = 'login.html'; }}
              onOpenDashboard={(type) => setDashboardModalType(type)}
            />

            {/* SECTION 06: KNOWLEDGE & CUSTOMER QUESTIONS (TESTIMONIALS & FAQ) */}
            <KnowledgeCustomerQuestions
              isDark={isDark}
              isRtl={isRtl}
            />

            {/* SECTION 07: START YOUR CREDIT JOURNEY (IMMERSIVE CONVERSION CTA) */}
            <StartYourCreditJourney
              isDark={isDark}
              isRtl={isRtl}
              onOpenLogin={() => { window.location.href = 'login.html'; }}
              onOpenDashboard={(type) => setDashboardModalType(type)}
            />
          </main>

          {/* COMPREHENSIVE FINTECH FOOTER (BASED ON NAVBAR CONTENT) */}
          <Footer
            isDark={isDark}
            isRtl={isRtl}
            onOpenLogin={() => { window.location.href = 'login.html'; }}
            onOpenDashboard={(type) => setDashboardModalType(type)}
            setHomeVariant={setHomeVariant}
            setActiveSection={setActiveSection}
          />

          {/* INTERACTIVE MODALS */}
          <LoginModal
            isOpen={loginModalOpen}
            onClose={() => setLoginModalOpen(false)}
            isDark={isDark}
          />

          <DashboardPreviewModal
            type={dashboardModalType}
            isOpen={!!dashboardModalType}
            onClose={() => setDashboardModalType(null)}
            isDark={isDark}
          />

        </div>
      );
    }

    // Render React Application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
