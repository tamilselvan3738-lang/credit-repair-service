    html, body {

      max-width: 100vw;

    }

    /* Glassmorphism styling */
    .glass-navbar {
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }

    .dark .glass-navbar {
      background: rgba(8, 14, 27, 0.82);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);

      background: rgba(255, 255, 255, 0.90);
      border-color: rgba(226, 232, 240, 0.95);
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Tactile 3D button effects */
    .btn-3d {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: translateY(0px) translateZ(0);
    }
    .btn-3d:hover {
      transform: translateY(-2px) translateZ(10px);
    }
    .btn-3d:active {
      transform: translateY(3px) translateZ(-5px) !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    .dark ::-webkit-scrollbar-track {
      background: #090e1a;
    }
    html:not(.dark) ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    /* RTL specific adjustments */
    [dir="rtl"] {
      text-align: right;
    }
  
    /* ==========================================================================
       ABOUT PAGE SCOPED FINTECH STYLES (SECTIONS 01 TO 07)
       ========================================================================== */
    .perspective-1000 {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
    }
    .about-mesh-glow {
      background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.15) 0%, rgba(6, 182, 212, 0.08) 50%, transparent 80%);
    }
    html:not(.dark) .about-mesh-glow {
      background: radial-gradient(circle at 50% 25%, rgba(16, 185, 129, 0.09) 0%, rgba(6, 182, 212, 0.05) 55%, transparent 80%);
    }
    .about-card-glow {
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .about-card-glow:hover {
      box-shadow: 0 15px 35px -10px rgba(16, 185, 129, 0.2), 0 0 0 1px rgba(16, 185, 129, 0.4);
    }
    html:not(.dark) .about-card-glow:hover {
      box-shadow: 0 15px 35px -10px rgba(16, 185, 129, 0.15), 0 0 0 1px rgba(16, 185, 129, 0.35);
    }
    .about-circuit-line {
      stroke-dasharray: 6 6;
      animation: circuitFlow 20s linear infinite;
    }
    @keyframes circuitFlow {
      to {
        stroke-dashoffset: -360;
      }
    }
    .about-pulse-beacon {
      animation: beaconPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes beaconPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

  
    /* ==========================================================================
       MODERN RESPONSIVE MOBILE-FIRST ARCHITECTURE (320px, 480px, 768px, 1024px)
       ========================================================================== */

    /* 1. Global Box Sizing & Universal Boundary Constraints */
    *, *::before, *::after {
      box-sizing: border-box !important;
    }

    html, body {
      overflow-x: hidden !important;
      width: 100% !important;
      max-width: 100vw !important;
      margin: 0 !important;
      padding: 0 !important;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 2. Fluid Responsive Media Scaling */
    img, svg, video, canvas {
      max-width: 100% !important;
      height: auto;
    }

    /* 3. Text Containment & Boundary Overflow Prevention */
    p, h1, h2, h3, h4, h5, h6, span, a, li, button, td, th {
      overflow-wrap: break-word !important;
      word-wrap: break-word !important;
      hyphens: manual;
    }

    /* 4. Mobile Interactive Controls & Touch Targets */
    button, input, select, textarea {
      max-width: 100% !important;
    }
    button, a.btn-3d {
      touch-action: manipulation;
    }

    /* 5. Fluid Responsive Table & Matrix Containment */
    .overflow-x-auto, [class*="overflow-x-auto"] {
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      max-width: 100% !important;
    }

    /* 6. Section Equal Spacing Standard */
    section {
      width: 100% !important;
      max-width: 100vw !important;
    }

    /* ==========================================================================
       RESPONSIVE BREAKPOINTS (320px, 480px, 768px, 1024px)
       ========================================================================== */

    /* Breakpoint 1: Ultra-compact handhelds (320px boundary, e.g. <= 359px) */
    @media (max-width: 359px) {
      section {
        padding-top: 2.75rem !important;
        padding-bottom: 2.75rem !important;
        padding-left: 0.75rem !important;
        padding-right: 0.75rem !important;
      }

        padding-left: 0.5rem !important;
        padding-right: 0.5rem !important;
      }

        font-size: 1.625rem !important;
        line-height: 1.2 !important;
      }
      h2, .font-display.text-3xl, .font-display.text-4xl {
        font-size: 1.35rem !important;
        line-height: 1.25 !important;
      }
      h3, .font-display.text-2xl {
        font-size: 1.15rem !important;
        line-height: 1.3 !important;
      }
      button, a.btn-3d {
        padding-left: 0.75rem !important;
        padding-right: 0.75rem !important;
        font-size: 0.8125rem !important;
      }
    }

    /* Breakpoint 2: Standard Mobile Handsets (360px to 479px, e.g. 480px boundary) */
    @media (min-width: 360px) and (max-width: 479px) {
      section {
        padding-top: 3.25rem !important;
        padding-bottom: 3.25rem !important;
        padding-left: 1rem !important;
        padding-right: 1rem !important;
      }
      h1, .font-display.text-5xl, .font-display.text-6xl {
        font-size: 1.95rem !important;
        line-height: 1.22 !important;
      }
      h2, .font-display.text-4xl {
        font-size: 1.55rem !important;
        line-height: 1.25 !important;
      }
    }

    /* Breakpoint 3: Phablets & Small Tablets (480px to 767px, e.g. 768px boundary) */
    @media (min-width: 480px) and (max-width: 767px) {
      section {
        padding-top: 4rem !important;
        padding-bottom: 4rem !important;
      }
      h1, .font-display.text-5xl, .font-display.text-6xl {
        font-size: 2.35rem !important;
        line-height: 1.22 !important;
      }
      h2, .font-display.text-4xl {
        font-size: 1.85rem !important;
        line-height: 1.25 !important;
      }
    }

    /* Breakpoint 4: Tablets & Small Laptops (768px to 1023px, e.g. 1024px boundary) */
    @media (min-width: 768px) and (max-width: 1023px) {

    }

      transform: scaleX(-1);
