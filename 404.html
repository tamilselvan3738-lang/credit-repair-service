          return localStorage.getItem('crs_theme') || 'dark';
        }
        return 'dark';
      });

        if (typeof window !== 'undefined') {
          return localStorage.getItem('crs_dir') || 'ltr';
        }
        return 'ltr';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.remove('dark');
          root.classList.add('light');
        }
        localStorage.setItem('crs_theme', theme);
      }, [theme]);

      useEffect(() => {
        const root = document.documentElement;
        root.setAttribute('dir', dir);
        localStorage.setItem('crs_dir', dir);
      }, [dir]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };

      const toggleDir = () => {
        setDir(prev => (prev === 'ltr' ? 'rtl' : 'ltr'));
      };

      const isDark = theme === 'dark';
      const isRtl = dir === 'rtl';

      return (
        <div className={`min-h-screen w-full relative flex flex-col justify-between py-6 px-3 sm:px-6 select-none ${
          isDark ? 'bg-[#030712] text-slate-100 cyber-grid-dark' : 'bg-slate-50 text-slate-900 cyber-grid-light'
        }`}>
          {/* Subtle Ambient Glowing Background Blobs */}
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
            <div 
              className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-[500px] h-[400px] rounded-full blur-[140px] pointer-events-none transition-opacity duration-700 ${
                isDark ? 'bg-gradient-to-tr from-emerald-600/15 via-cyan-500/15 to-transparent opacity-85' : 'bg-gradient-to-tr from-emerald-300/20 via-cyan-200/25 to-transparent opacity-65'

          {/* FLOATING TOP-RIGHT CONTROLS: RTL (⇄) & THEME (Sun / Moon) */}
          {/* ================================================================ */}

            <button
              type="button"
              onClick={toggleDir}
              aria-label="Toggle Direction"
              title={`Switch to ${dir === 'ltr' ? 'Right-to-Left (RTL)' : 'Left-to-Right (LTR)'}`}
              className={`w-9 h-9 rounded-full border flex items-center justify-center transition-all duration-300 ${
                isDark
                  ? 'bg-slate-900/80 hover:bg-slate-800 text-slate-300 hover:text-cyan-400 border-slate-700/80 shadow-md'
                  : 'bg-white hover:bg-slate-100 text-slate-700 hover:text-cyan-600 border-slate-300 shadow-sm'
              }`}
            >
              <IconArrowLeftRight className="w-4 h-4" />
            </button>

            <button
              type="button"
              onClick={toggleTheme}
              aria-label="Toggle Light/Dark Theme"
              title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}
              className={`w-9 h-9 rounded-full border flex items-center justify-center transition-all duration-300 ${
                isDark
                  ? 'bg-slate-900/90 hover:bg-slate-800 text-amber-400 hover:text-amber-300 border-slate-700 shadow-md'
                  : 'bg-white hover:bg-slate-100 text-slate-800 hover:text-indigo-600 border-slate-300 shadow-sm'
              }`}
            >
              {isDark ? (
                <IconSun className="w-5 h-5 text-amber-400" />
              ) : (
                <IconMoon className="w-5 h-5 text-indigo-600" />
              )}
            </button>
          </div>

          {/* ================================================================ */}
          {/* MAIN 404 CARD CONTAINER (Single-screen fitting, zero overflow) */}
          {/* ================================================================ */}
          <main className="relative z-10 flex-1 flex items-center justify-center px-4 py-2 my-auto">
            <motion.div
              initial={{ opacity: 0, scale: 0.96, y: 12 }}
              animate={{ opacity: 1, scale: 1, y: 0 }}
              transition={{ duration: 0.35, ease: "easeOut" }}
              className={`w-full max-w-[440px] rounded-3xl p-6 sm:p-8 transition-all duration-300 text-center relative overflow-hidden ${
                isDark ? 'glass-card-dark' : 'glass-card-light'
              }`}
            >
              {/* Brand Logo at top */}
              <div className="flex justify-center mb-3 transform hover:scale-105 transition-transform duration-300">
                <BrandLogo isDark={isDark} />
              </div>

              {/* Status Badge */}
              <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-[10px] font-mono font-bold tracking-widest uppercase mb-3">
                <span className="w-1.5 h-1.5 rounded-full bg-red-400 animate-ping" />
                <span>ERROR 404: TRADELINE RECORD NOT FOUND</span>
              </div>

              {/* Giant Glowing 404 Text */}
              <div className="my-1">
                <span className="font-display font-black text-6xl sm:text-7xl tracking-tighter bg-gradient-to-r from-emerald-400 via-cyan-400 to-indigo-500 bg-clip-text text-transparent glow-num">
                  404
                </span>
              </div>

              {/* Title & Explanatory Subtitle */}
              <h1 className={`font-display font-bold text-lg sm:text-xl tracking-tight mb-2 ${
                isDark ? 'text-white' : 'text-slate-900'
              }`}>
                Tradeline File Unreachable
              </h1>
              <p className={`text-xs leading-relaxed mb-4 max-w-sm mx-auto ${
                isDark ? 'text-slate-400' : 'text-slate-600'
              }`}>
                The financial intelligence dossier or endpoint you requested is unavailable, purged under FCRA § 611 statutory archiving, or has moved to a new route.
              </p>

              {/* Diagnostic Telemetry HUD Box */}
              <div className={`p-3 rounded-2xl border text-left text-[11px] font-mono mb-5 space-y-1 ${
                isDark ? 'bg-slate-950/70 border-slate-800/90 text-slate-300' : 'bg-slate-100/90 border-slate-200 text-slate-700'
              }`}>
                <div className="flex items-center justify-between">
                  <span className="text-slate-500">ROUTING NODE:</span>
                  <span className="text-cyan-400 font-semibold">e-OSCAR Bureau Gateway</span>
                </div>
                <div className="flex items-center justify-between">
                  <span className="text-slate-500">ENCRYPTION:</span>
                  <span className="text-emerald-400 font-semibold">AES-256-GCM Handshake</span>
                </div>
                <div className="flex items-center justify-between">
                  <span className="text-slate-500">SUGGESTION:</span>
                  <span className="text-amber-400 font-semibold">Return to Main Platform</span>
                </div>
              </div>

              {/* Primary & Secondary Action Recovery Buttons */}
              <div className="space-y-2">
                <a
                  href="index.html"
                  className="w-full py-2.5 px-4 rounded-xl font-display font-bold text-xs tracking-wider text-white bg-gradient-to-r from-emerald-600 via-teal-500 to-emerald-600 hover:from-emerald-500 hover:to-teal-500 shadow-[0_8px_20px_rgba(16,185,129,0.4)] gloss-sheen flex items-center justify-center gap-2 uppercase tracking-widest transition-all duration-300 transform active:scale-[0.98]"
                >
                  <IconHome className="w-3.5 h-3.5" />
                  <span>Return to Homepage</span>
                </a>

                <div className="grid grid-cols-2 gap-2 pt-0.5">
                  <a
                    href="login.html"
                    className={`py-2 px-3 rounded-xl text-xs font-bold tracking-wide transition-all duration-200 border flex items-center justify-center gap-1.5 ${
                      isDark
                        ? 'border-slate-700/80 hover:border-cyan-400/50 bg-slate-900/60 hover:bg-slate-800 text-slate-300 hover:text-white'
                        : 'border-slate-300 hover:border-cyan-600 bg-white hover:bg-slate-50 text-slate-800'
                    }`}
                  >
                    <IconLock className="w-3.5 h-3.5" />
                    <span>Client Login</span>
                  </a>

                  <a
                    href="contact.html"
                    className={`py-2 px-3 rounded-xl text-xs font-bold tracking-wide transition-all duration-200 border flex items-center justify-center gap-1.5 ${
                      isDark
                        ? 'border-slate-700/80 hover:border-emerald-400/50 bg-slate-900/60 hover:bg-slate-800 text-slate-300 hover:text-white'
                        : 'border-slate-300 hover:border-emerald-600 bg-white hover:bg-slate-50 text-slate-800'
                    }`}
                  >
                    <IconAlertTriangle className="w-3.5 h-3.5" />
                    <span>Support Desk</span>
                  </a>
                </div>
              </div>
            </motion.div>
          </main>

          {/* ================================================================ */}
          {/* COMPACT FOOTER BAR */}
          {/* ================================================================ */}
          <footer className="relative z-20 w-full py-2.5 text-center text-[10px] text-slate-400 border-t border-slate-800/30">
            <div className="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-center gap-2 sm:gap-4 font-mono">
              <span>© 2026 CREDIT REPAIR SERVICE. All Rights Reserved.</span>
              <span className="text-slate-600">•</span>
              <a href="index.html#contact" className="hover:text-emerald-400 transition-colors">
                Book Consultation
              </a>
              <span className="text-slate-600">•</span>
              <a href="contact.html" className="hover:text-cyan-400 transition-colors">
                Emergency Dispatch
              </a>
            </div>
          </footer>
        </div>
      );
    }

    // Render React Root
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<NotFoundPage />);
  </script>
</body>
