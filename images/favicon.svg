<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="crsCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2d" />
      <stop offset="100%" stop-color="#05281e" />
    </linearGradient>
    <linearGradient id="crsCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="crsWrenchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="crsTrajectoryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <linearGradient id="crsGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Circular FinTech Brand Container with Glowing Border -->
  <circle cx="18" cy="18" r="17.2" fill="#080d1a" stroke="#06B6D4" stroke-width="1.5" />

  <!-- 1. The Credit Card Silhouette (CREDIT) -->
  <rect x="5.5" y="9.5" width="25" height="15.5" rx="2.5" fill="url(#crsCardBg)" stroke="url(#crsCardBorder)" stroke-width="1.4" />
  
  <!-- Magnetic Stripe Band -->
  <rect x="5.5" y="12.5" width="25" height="2.2" fill="#06B6D4" fill-opacity="0.3" />

  <!-- Golden EMV Smart Microchip -->
  <rect x="8" y="16.2" width="3.8" height="3" rx="0.6" fill="url(#crsGoldGrad)" />
  <line x1="9.9" y1="16.2" x2="9.9" y2="19.2" stroke="#78350F" stroke-width="0.4" />
  <line x1="8" y1="17.7" x2="11.8" y2="17.7" stroke="#78350F" stroke-width="0.4" />

  <!-- Tradeline Credit Account Tracks (Embossed Digits) -->
  <rect x="13.2" y="16.5" width="4" height="1.1" rx="0.55" fill="#67E8F9" fill-opacity="0.85" />
  <rect x="18.5" y="16.5" width="4" height="1.1" rx="0.55" fill="#67E8F9" fill-opacity="0.85" />
  <rect x="13.2" y="18.8" width="5.8" height="1" rx="0.5" fill="#34D399" fill-opacity="0.8" />

  <!-- 2. Precision Mechanical Repair Wrench (REPAIR) -->
  <path d="M10.5 30.5 L17.5 23.5" stroke="url(#crsWrenchGrad)" stroke-width="2.4" stroke-linecap="round" />
  <path d="M16.5 24.5 L20 21 C20.7 20.3 20.7 19.2 20 18.5 L19.7 18.2 C19 17.5 17.9 17.5 17.2 18.2 L15.7 19.7" 
        stroke="url(#crsWrenchGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 3. Upward Score Rebound Trajectory Surge Arrow (FICO 850) -->
  <path d="M14 24.5 L21 17.5 L24 20.2 L29.5 11" stroke="url(#crsTrajectoryGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M25.5 11 H29.5 V15" stroke="url(#crsTrajectoryGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4. Restored Prime Score Starburst of Excellence (SERVICE) -->
  <circle cx="29.5" cy="11" r="1.3" fill="#FFFFFF" />
  <path d="M29.5 8.5 V13.5 M27 11 H32" stroke="#67E8F9" stroke-width="0.9" stroke-linecap="round" />
</svg>