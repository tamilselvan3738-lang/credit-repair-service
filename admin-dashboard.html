                          className={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-between transition-all ${
                            isActive
                              ? 'bg-amber-500/15 border-l-4 border-amber-400 border-y border-r border-amber-500/30 text-amber-300 shadow-[0_0_15px_rgba(245,158,11,0.15)] font-bold'
                              : 'text-slate-300 hover:text-white hover:bg-slate-800/70 bg-slate-900/50 border border-slate-800/60 font-medium'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="text-base">{item.icon}</span>
                            <span>{item.label}</span>
                          </div>
                          {item.badge && (
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                              isActive ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                            }`}>
                              {item.badge}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* Logout in Hamburger Menu */}
                  <div className="pt-3 pb-6 border-t border-slate-800/80">
                    <button
                      onClick={() => {
                        setIsMobileMenuOpen(false);
                        onOpenLogout();
                      }}
                      className="w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 flex items-center gap-2.5 transition-colors border border-rose-500/20 bg-rose-500/5"
                    >
                      <span className="text-base">🚪</span>
                      <span>Sign Out / Logout</span>
                    </button>
                  </div>
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </>
      );
    };

    // ==========================================
    // SIDEBAR NAVIGATION WITH ALL 17 CONCEPTS
    // ==========================================
    const NAV_ITEMS = [
      { id: "overview", label: "Dashboard Overview", icon: <IconOverview className="w-4 h-4 text-amber-400" />, badge: null },
      { id: "clients", label: "Client Management", icon: <IconUsers className="w-4 h-4 text-emerald-400" />, badge: "2,845" },
      { id: "reports", label: "Credit Report Management", icon: <IconReports className="w-4 h-4 text-cyan-400" />, badge: null },
      { id: "disputes", label: "Dispute Management", icon: <IconScale className="w-4 h-4 text-rose-400" />, badge: "184" },
      { id: "documents", label: "Document Management", icon: <IconFolder className="w-4 h-4 text-amber-400" />, badge: "39" },
      { id: "scores", label: "Credit Score Management", icon: <IconTrendingUp className="w-4 h-4 text-indigo-400" />, badge: null },
      { id: "monitoring", label: "Credit Monitoring", icon: <IconBell className="w-4 h-4 text-emerald-400" />, badge: null },
      { id: "specialists", label: "Credit Specialists", icon: <IconSpecialist className="w-4 h-4 text-cyan-400" />, badge: "16" },
      { id: "plans", label: "Pricing Plan Management", icon: <IconCreditCard className="w-4 h-4 text-violet-400" />, badge: null },
      { id: "subscriptions", label: "Subscription Management", icon: <IconRefresh className="w-4 h-4 text-amber-400" />, badge: null },
      { id: "billing", label: "Billing & Payment", icon: <IconCoins className="w-4 h-4 text-emerald-400" />, badge: null },
      { id: "communication", label: "Communication Management", icon: <IconMessageSquare className="w-4 h-4 text-blue-400" />, badge: "3" },
      { id: "feedback", label: "Feedback & Complaints", icon: <IconStar className="w-4 h-4 text-amber-400" />, badge: null },
      { id: "analytics", label: "Reports & Analytics", icon: <IconAnalytics className="w-4 h-4 text-rose-400" />, badge: null },
      { id: "content", label: "Website Content (CMS)", icon: <IconGlobe className="w-4 h-4 text-teal-400" />, badge: null },
      { id: "security", label: "Security & Compliance", icon: <IconShield className="w-4 h-4 text-emerald-400" />, badge: "100%" },
    ];

    const Sidebar = ({ activeTab, setActiveTab, onOpenLogout }) => {
      return (
        <aside className="hidden lg:flex w-64 lg:w-72 flex-shrink-0 bg-[#060b18]/90 border-r border-slate-800/80 p-4 flex-col justify-between overflow-y-auto custom-scrollbar h-[calc(100vh-61px)]">
          <div className="space-y-4">
            {/* Top Admin Badge & Tool Switcher matching Reference Screenshot */}
            <div className="flex items-center justify-between pb-3 border-b border-slate-800/80 px-1">
              <div className="flex items-center gap-2">
                <div className="w-6 h-6 rounded bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-xs">
                  <IconSettings className="w-3.5 h-3.5 text-amber-400" />
                </div>
                <span className="font-display font-extrabold text-sm tracking-wider uppercase text-amber-400">
                  ADMIN
                </span>
              </div>
              <span className="text-[10px] font-mono text-slate-500 bg-slate-900 px-2 py-0.5 rounded">
                v2.6 FinTech
              </span>
            </div>

            {/* Navigation Concept List (16 items) */}
            <nav className="space-y-1">
              {NAV_ITEMS.map((item) => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-between transition-all relative ${
                      isActive 
                        ? 'bg-amber-500/10 border border-amber-500/40 text-amber-300 shadow-[0_0_15px_rgba(245,158,11,0.15)] font-bold' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/60'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      {isActive && (
                        <span className="w-1.5 h-4 rounded-full bg-amber-400 -ml-1"></span>
                      )}
                      <span className="text-sm">{item.icon}</span>
                      <span className="truncate">{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                        isActive ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                      }`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>
          </div>

          {/* Item 17: Sign Out / Logout at Bottom of Sidebar */}
          <div className="pt-4 border-t border-slate-800/80 mt-4">
            <button
              onClick={onOpenLogout}
              className="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 flex items-center gap-2.5 transition-colors border border-transparent hover:border-rose-500/20"
            >
              <IconLogout className="w-4 h-4 text-rose-400" />
              <span>Sign Out / Logout</span>
            </button>
          </div>
        </aside>
      );
    };

    // ==========================================
    // MAIN APPLICATION CONTAINER
    // ==========================================
    const AdminDashboardApp = () => {
      const [activeTab, setActiveTab] = useState("overview");
      const [isDark, setIsDark] = useState(true);
      const [dir, setDir] = useState("ltr");
      const [toastMessage, setToastMessage] = useState("");
      const [modalState, setModalState] = useState({
        registerClient: false,
        newDispute: false,
        uploadDoc: false,
        logoutConfirm: false
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 4000);
      };

      const handleOpenModal = (name) => {
        setModalState(prev => ({ ...prev, [name]: true }));
      };

      const handleCloseModal = (name) => {
        setModalState(prev => ({ ...prev, [name]: false }));
      };

      return (
        <div className={`min-h-screen ${isDark ? 'bg-[#050914]' : 'bg-slate-100'} text-slate-100 flex flex-col font-sans transition-colors duration-300`}>
          {/* Top Navbar */}
          <TopNavbar 
            isDark={isDark} 
            setIsDark={setIsDark} 
            dir={dir} 
            setDir={setDir} 
            onOpenLogout={() => handleOpenModal('logoutConfirm')} 
            showToast={showToast}
            activeTab={activeTab}
            setActiveTab={setActiveTab}
          />

          {/* Body with Sidebar and Main Content Area */}
          <div className="flex flex-1 overflow-hidden">
            <Sidebar 
              activeTab={activeTab} 
              setActiveTab={setActiveTab} 
              onOpenLogout={() => handleOpenModal('logoutConfirm')} 
            />

            {/* Main Content Workspace */}
            <main className="flex-1 p-4 lg:p-8 overflow-y-auto custom-scrollbar h-[calc(100vh-61px)]">
              <AnimatePresence mode="wait">
                {activeTab === "overview" && <DashboardOverviewView key="overview" onOpenModal={handleOpenModal} showToast={showToast} isDark={isDark} />}
                {activeTab === "clients" && <ClientManagementView key="clients" onOpenModal={handleOpenModal} showToast={showToast} isDark={isDark} />}
                {activeTab === "reports" && <CreditReportManagementView key="reports" showToast={showToast} isDark={isDark} />}
                {activeTab === "disputes" && <DisputeManagementView key="disputes" onOpenModal={handleOpenModal} showToast={showToast} isDark={isDark} />}
                {activeTab === "documents" && <DocumentManagementView key="documents" onOpenModal={handleOpenModal} showToast={showToast} isDark={isDark} />}
                {activeTab === "scores" && <CreditScoreManagementView key="scores" showToast={showToast} isDark={isDark} />}
                {activeTab === "monitoring" && <CreditMonitoringView key="monitoring" showToast={showToast} isDark={isDark} />}
                {activeTab === "specialists" && <CreditSpecialistView key="specialists" showToast={showToast} isDark={isDark} />}
                {activeTab === "plans" && <PricingPlanManagementView key="plans" showToast={showToast} isDark={isDark} />}
                {activeTab === "subscriptions" && <SubscriptionManagementView key="subscriptions" showToast={showToast} isDark={isDark} />}
                {activeTab === "billing" && <BillingPaymentView key="billing" showToast={showToast} isDark={isDark} />}
                {activeTab === "communication" && <CommunicationView key="communication" showToast={showToast} isDark={isDark} />}
                {activeTab === "feedback" && <FeedbackComplaintsView key="feedback" showToast={showToast} isDark={isDark} />}
                {activeTab === "analytics" && <ReportsAnalyticsView key="analytics" showToast={showToast} isDark={isDark} />}
                {activeTab === "content" && <WebsiteContentView key="content" showToast={showToast} isDark={isDark} />}
                {activeTab === "security" && <SecurityComplianceView key="security" showToast={showToast} isDark={isDark} />}
              </AnimatePresence>
            </main>
          </div>

          {/* Interactive Modals */}
          <RegisterClientModal isOpen={modalState.registerClient} onClose={() => handleCloseModal('registerClient')} showToast={showToast} />
          <NewDisputeModal isOpen={modalState.newDispute} onClose={() => handleCloseModal('newDispute')} showToast={showToast} />
          <UploadDocModal isOpen={modalState.uploadDoc} onClose={() => handleCloseModal('uploadDoc')} showToast={showToast} />
          <LogoutConfirmModal isOpen={modalState.logoutConfirm} onClose={() => handleCloseModal('logoutConfirm')} />

          {/* Interactive Toast Notifications */}
          <Toast message={toastMessage} onClose={() => setToastMessage("")} />
        </div>
      );
    };

    // Mount to DOM root
    const rootElement = document.getElementById("root");
    ReactDOM.createRoot(rootElement).render(<AdminDashboardApp />);
  </script>
</body>
</html>
