                      <div className="font-bold text-white pb-2 border-b border-slate-800 flex justify-between items-center">

                        <div className="p-2 rounded bg-slate-900 text-slate-300">

                    </div>
                    <span className="font-semibold">David Chen</span>
                    <span className="text-[10px] text-slate-400">▾</span>
                  </button>

                  {showProfileMenu && (
                    <div className="absolute right-0 mt-2 w-48 rounded-xl bg-[#091024] border border-slate-700 shadow-2xl p-2 z-50 text-xs">
                      <div className="px-3 py-1.5 text-slate-400 border-b border-slate-800 font-mono text-[10px]">

                      </div>
                      <button onClick={() => { setShowProfileMenu(false); showToast("Opened Security Profile"); }} className="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-200">

                      <button onClick={() => { setShowProfileMenu(false); onOpenLogout(); }} className="w-full text-left px-3 py-2 rounded-lg hover:bg-rose-500/20 text-rose-400 font-semibold">

              </div>
            </div>
          </header>

          {/* Mobile & Tablet Full-Height Overlay Drawer */}
          <AnimatePresence>
            {isMobileMenuOpen && (

                initial={{ opacity: 0, y: -10 }}
                animate={{ opacity: 1, y: 0 }}
                exit={{ opacity: 0, y: -10 }}
                transition={{ duration: 0.22, ease: "easeOut" }}
                className={`lg:hidden fixed inset-x-0 top-[64px] bottom-0 z-50 overflow-y-auto min-h-[calc(100vh-64px)] ${
                  isDark ? 'bg-[#060b18] text-white' : 'bg-slate-900 text-white'
                } border-t border-slate-800/80 shadow-2xl`}
              >
                <div className="p-4 sm:p-6 space-y-4 max-w-lg mx-auto w-full pb-28">
                  {/* User Profile Card + Badge */}
                  <div className="p-3.5 rounded-2xl bg-[#0b1429] border border-slate-700/70 flex items-center justify-between shadow-md">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-emerald-500 text-slate-950 font-bold flex items-center justify-center text-sm shadow-[0_0_12px_rgba(16,185,129,0.4)]">
                        DC
                      </div>
                      <div>
                        <div className="font-bold text-sm text-white">David Chen</div>
                        <div className="text-[11px] text-emerald-400 font-mono font-bold">684 FICO (+144 pts) • Pro Member</div>
                      </div>
                    </div>
                    <span className="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-mono font-bold uppercase">
                      CLIENT
                    </span>
                  </div>

                  {/* Quick System Actions Row: Back to Home, Theme Toggle, Direction Toggle, Notification Button */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <a
                      href="index.html"
                      className="py-2.5 px-3 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-slate-300 hover:text-white flex items-center justify-center gap-1.5 transition-colors text-center"
                    >
                      <span>←</span>
                      <span>Back Home</span>
                    </a>

                    <button
                      type="button"
                      onClick={toggleTheme}
                      className="py-2.5 px-3 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-amber-400 hover:text-amber-300 flex items-center justify-center gap-1.5 transition-colors"
                    >
                      <span>{isDark ? '☀️' : '🌙'}</span>
                      <span>{isDark ? 'Light' : 'Dark'} Mode</span>
                    </button>

                    <button
                      type="button"
                      onClick={toggleDir}
                      className="py-2.5 px-3 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-slate-300 hover:text-white flex items-center justify-center gap-1.5 transition-colors"
                    >
                      <span>⇄</span>
                      <span>Dir: {dir.toUpperCase()}</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => showToast("3 Unread Alerts: FICO +24 pts and 2 bureau updates")}
                      className="py-2.5 px-3 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-emerald-400 hover:text-emerald-300 flex items-center justify-center gap-1.5 transition-colors relative"

                      <span>🔔</span>
                      <span>Alerts (3)</span>
                    </button>
                  </div>

                  {/* Website Pages Dropdown for Mobile & Tablet */}
                  <div className="rounded-2xl border border-slate-800 bg-slate-900/60 overflow-hidden">
                    <button
                      type="button"
                      onClick={() => setMobilePagesExpanded(!mobilePagesExpanded)}
                      className="w-full p-3 flex items-center justify-between text-xs font-bold text-slate-200 hover:bg-slate-800/60 transition-colors"
                    >
                      <span className="flex items-center gap-2">
                        <span>🌐</span>
                        <span>All Website Pages</span>
                      </span>
                      <span className="text-slate-400 text-[10px]">{mobilePagesExpanded ? '▲' : '▼'}</span>
                    </button>
                    {mobilePagesExpanded && (
                      <div className="p-2 space-y-1 bg-slate-950/60 border-t border-slate-800 text-xs">
                        <a href="index.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Home 1</a>
                        <a href="home-2.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Home 2</a>
                        <a href="about.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">About</a>
                        <a href="services.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Services</a>
                        <a href="credit-repair.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Credit Repair</a>
                        <a href="plans.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Plans</a>
                        <a href="resources.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Resources</a>
                        <a href="contact.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Contact</a>
                        <a href="admin-dashboard.html" className="block px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Admin Dashboard</a>
                        <a href="user-dashboard.html" className="block px-3 py-2 rounded-lg bg-emerald-500/20 text-emerald-300 font-bold">User Dashboard (Active)</a>
                      </div>
                    )}
                  </div>

                  {/* Full Navigation Concept List for Mobile & Tablet */}
                  <div className="space-y-1.5 pt-1">
                    <div className="text-[11px] font-mono font-bold uppercase tracking-wider text-slate-400 px-1 pt-2 pb-1">
                      Client Portal Modules (13 Services)
                    </div>
                    {USER_NAV_ITEMS.map((item) => {
                      const isActive = activeTab === item.id;
                      return (
                        <button
                          key={item.id}
                          onClick={() => handleMobileNavClick(item.id)}
                          className={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-between transition-all ${
                            isActive
                              ? 'bg-emerald-500/15 border-l-4 border-emerald-400 border-y border-r border-emerald-500/30 text-emerald-300 shadow-[0_0_15px_rgba(16,185,129,0.15)] font-bold'
                              : 'text-slate-300 hover:text-white hover:bg-slate-800/70 bg-slate-900/50 border border-slate-800/60 font-medium'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="flex-shrink-0">{item.icon}</span>
                            <span>{item.label}</span>
                          </div>
                          {item.badge && (
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                              isActive ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                            }`}>
                              {item.badge}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* Concept 14: Logout in Hamburger Menu */}
                  <div className="pt-3 pb-6 border-t border-slate-800/80">
                    <button
                      onClick={() => {
                        setIsMobileMenuOpen(false);
                        onOpenLogout();
                      }}
                      className="w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 flex items-center gap-2.5 transition-colors border border-rose-500/20 bg-rose-500/5"
                    >
                      <IconLogout className="w-4 h-4 text-rose-400" />
                      <span>Sign Out / Logout</span>
                    </button>
                  </div>
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </>
      );
    };

    // ==========================================

    // ==========================================
    const USER_NAV_ITEMS = [
      { id: "overview", label: "Dashboard Overview", icon: <IconOverview className="w-4 h-4 text-emerald-400" />, badge: null },
      { id: "profile", label: "My Profile", icon: <IconUser className="w-4 h-4 text-cyan-400" />, badge: null },
      { id: "credit-score", label: "My Credit Score", icon: <IconTrendingUp className="w-4 h-4 text-emerald-400" />, badge: "684" },
      { id: "credit-reports", label: "My Credit Reports", icon: <IconReports className="w-4 h-4 text-indigo-400" />, badge: null },
      { id: "disputes", label: "My Disputes", icon: <IconScale className="w-4 h-4 text-rose-400" />, badge: "3" },
      { id: "documents", label: "Document Management", icon: <IconFolder className="w-4 h-4 text-amber-400" />, badge: "1 Alert" },
      { id: "monitoring", label: "Credit Monitoring", icon: <IconBell className="w-4 h-4 text-cyan-400" />, badge: null },
      { id: "improvement-plan", label: "My Improvement Plan", icon: <IconTarget className="w-4 h-4 text-emerald-400" />, badge: "720+" },
      { id: "pricing", label: "Subscription & Pricing", icon: <IconCreditCard className="w-4 h-4 text-violet-400" />, badge: "Pro" },
      { id: "payments", label: "Payments & Invoices", icon: <IconCoins className="w-4 h-4 text-amber-400" />, badge: null },
      { id: "notifications", label: "Notifications", icon: <IconMail className="w-4 h-4 text-blue-400" />, badge: "3" },
      { id: "communication", label: "Communication", icon: <IconMessageSquare className="w-4 h-4 text-emerald-400" />, badge: "Specialist" },
      { id: "feedback", label: "Feedback & Reviews", icon: <IconStar className="w-4 h-4 text-amber-400" />, badge: null },
    ];

    const UserSidebar = ({ activeTab, setActiveTab, onOpenLogout }) => {
      return (
        <aside className="hidden lg:flex w-64 lg:w-72 flex-shrink-0 bg-[#060b18]/90 border-r border-slate-800/80 p-4 flex-col justify-between overflow-y-auto custom-scrollbar h-[calc(100vh-61px)]">
          <div className="space-y-4">
            {/* Top Client Badge */}
            <div className="flex items-center justify-between pb-3 border-b border-slate-800/80 px-1">
              <div className="flex items-center gap-2">
                <div className="w-6 h-6 rounded bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xs">
                  <IconShield className="w-3.5 h-3.5 text-emerald-400" />
                </div>
                <span className="font-display font-extrabold text-sm tracking-wider uppercase text-emerald-400">
                  CLIENT PORTAL
                </span>
              </div>
              <span className="text-[10px] font-mono text-cyan-400 bg-slate-900 px-2 py-0.5 rounded">
                FCRA Legal
              </span>
            </div>

            {/* Navigation Concept List (13 items) */}
            <nav className="space-y-1">
              {USER_NAV_ITEMS.map((item) => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-between transition-all relative ${
                      isActive 
                        ? 'bg-emerald-500/10 border border-emerald-500/40 text-emerald-300 shadow-[0_0_15px_rgba(16,185,129,0.15)] font-bold' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/60'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      {isActive && (
                        <span className="w-1.5 h-4 rounded-full bg-emerald-400 -ml-1"></span>
                      )}
                      <span className="text-sm">{item.icon}</span>
                      <span className="truncate">{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                        isActive ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                      }`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>
          </div>

          {/* Concept 14: Sign Out / Logout at Bottom of Sidebar */}
          <div className="pt-4 border-t border-slate-800/80 mt-4">
            <button
              onClick={onOpenLogout}
              className="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 flex items-center gap-2.5 transition-colors border border-transparent hover:border-rose-500/20"
            >
              <IconLogout className="w-4 h-4 text-rose-400" />
              <span>Sign Out / Logout</span>
            </button>
          </div>
        </aside>
      );
    };

    // ==========================================
    // MAIN APPLICATION CONTAINER (USER DASHBOARD)
    // ==========================================
    const UserDashboardApp = () => {
      const [activeTab, setActiveTab] = useState("overview");
      const [isDark, setIsDark] = useState(true);
      const [dir, setDir] = useState("ltr");
      const [toastMessage, setToastMessage] = useState("");
      const [modalState, setModalState] = useState({
        newDispute: false,
        uploadDoc: false,
        logoutConfirm: false
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 4000);
      };

      const handleOpenModal = (name) => {
        setModalState(prev => ({ ...prev, [name]: true }));
      };

      const handleCloseModal = (name) => {
        setModalState(prev => ({ ...prev, [name]: false }));
      };

      return (
        <div className={`min-h-screen ${isDark ? 'bg-[#050914]' : 'bg-slate-100'} text-slate-100 flex flex-col font-sans transition-colors duration-300`}>
          {/* Top Navbar */}
          <UserTopNavbar 
            isDark={isDark} 
            setIsDark={setIsDark} 
            dir={dir} 
            setDir={setDir} 
            onOpenLogout={() => handleOpenModal('logoutConfirm')} 
            showToast={showToast}
            activeTab={activeTab}
            setActiveTab={setActiveTab}
          />

          {/* Body with Sidebar and Main Content Area */}
          <div className="flex flex-1 overflow-hidden">
            <UserSidebar 
              activeTab={activeTab} 
              setActiveTab={setActiveTab} 
              onOpenLogout={() => handleOpenModal('logoutConfirm')} 
            />

            {/* Main Content Workspace */}
            <main className="flex-1 p-4 lg:p-8 overflow-y-auto custom-scrollbar h-[calc(100vh-61px)]">
              <AnimatePresence mode="wait">
                {activeTab === "overview" && <UserOverviewView key="overview" onOpenModal={handleOpenModal} showToast={showToast} isDark={isDark} setActiveTab={setActiveTab} />}
                {activeTab === "profile" && <UserProfileView key="profile" showToast={showToast} isDark={isDark} />}
                {activeTab === "credit-score" && <UserCreditScoreView key="credit-score" showToast={showToast} isDark={isDark} />}
                {activeTab === "credit-reports" && <UserCreditReportsView key="credit-reports" showToast={showToast} isDark={isDark} />}
                {activeTab === "disputes" && <UserDisputesView key="disputes" onOpenModal={handleOpenModal} showToast={showToast} isDark={isDark} />}
                {activeTab === "documents" && <UserDocumentManagementView key="documents" onOpenModal={handleOpenModal} showToast={showToast} isDark={isDark} />}
                {activeTab === "monitoring" && <UserCreditMonitoringView key="monitoring" showToast={showToast} isDark={isDark} />}
                {activeTab === "improvement-plan" && <UserImprovementPlanView key="improvement-plan" showToast={showToast} isDark={isDark} />}
                {activeTab === "pricing" && <UserSubscriptionPricingView key="pricing" showToast={showToast} isDark={isDark} />}
                {activeTab === "payments" && <UserPaymentsInvoicesView key="payments" showToast={showToast} isDark={isDark} />}
                {activeTab === "notifications" && <UserNotificationsView key="notifications" showToast={showToast} isDark={isDark} />}
                {activeTab === "communication" && <UserCommunicationView key="communication" showToast={showToast} isDark={isDark} />}
                {activeTab === "feedback" && <UserFeedbackReviewsView key="feedback" showToast={showToast} isDark={isDark} />}
              </AnimatePresence>
            </main>
          </div>

          {/* Interactive Modals */}
          <UserNewDisputeModal isOpen={modalState.newDispute} onClose={() => handleCloseModal('newDispute')} showToast={showToast} />
          <UserUploadDocModal isOpen={modalState.uploadDoc} onClose={() => handleCloseModal('uploadDoc')} showToast={showToast} />
          <UserLogoutConfirmModal isOpen={modalState.logoutConfirm} onClose={() => handleCloseModal('logoutConfirm')} />

          {/* Interactive Toast Notifications */}
          <Toast message={toastMessage} onClose={() => setToastMessage("")} />
        </div>
      );
    };

    // Mount to DOM root
    const rootElement = document.getElementById("root");
    ReactDOM.createRoot(rootElement).render(<UserDashboardApp />);
  </script>
</body>
</html>
